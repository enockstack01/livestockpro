  <script>
    // Applied before first paint so switching to/from dark mode never flashes
    // the wrong theme — src/theme/ThemeProvider.jsx takes over from here once
    // React mounts (same storage key, same resolution logic).
    (function () {
      try {
        var saved = localStorage.getItem('lp_theme_preference');
        var pref = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
        var scheme = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', scheme);
      } catch (e) { /* storage/matchMedia unavailable — default light styles apply */ }
    })();
  </script>
