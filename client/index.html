<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LivestockPro</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    // Applied before first paint so switching to/from dark mode never flashes
    // the wrong theme — src/theme/ThemeProvider.jsx takes over from here once
    // React mounts (same storage key, same resolution logic).
    (function () {
      try {
        var saved = localStorage.getItem('lp_theme_preference');
        var pref = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
        var scheme = pref === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', scheme);
      } catch (e) { /* storage/matchMedia unavailable — default light styles apply */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
