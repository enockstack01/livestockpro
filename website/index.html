<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LivestockPro — Login</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="authPage">

  <!-- Supabase JS Client — pinned version for reliability -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

  <!-- Your config and auth module -->
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <div class="auth-page">

    <!-- Left Branding Panel -->
    <div class="auth-brand">
      <div class="auth-brand-icon">
        <i class="fas fa-leaf"></i>
      </div>
      <h1>LivestockPro</h1>
      <p>Streamline your farm operations. Track animals, health, breeding, feeding, production, and finances — all in one place.</p>
    </div>

    <!-- Right Form Panel -->
    <div class="auth-form-section">
      <div class="auth-form-wrapper">

        <h2>Welcome</h2>
        <p class="subtitle">Sign in to your farm management dashboard</p>

        <!-- Connection status indicator -->
        <div id="connectionStatus" style="display:none;padding:10px 14px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:18px;"></div>

        <!-- Tabs: Login / Sign Up -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Sign In</button>
          <button type="button" class="auth-tab" id="tabSignup" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
          </div>
          <div id="loginError" style="display:none;color:var(--red);font-size:12px;margin-bottom:12px;"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;" id="loginSubmitBtn">
            <i class="fas fa-right-to-bracket"></i> Sign In
          </button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form" id="signupForm">
          <div class="form-group">
            <label for="signupFarmName">Farm Name</label>
            <input type="text" id="signupFarmName" class="form-control" placeholder="My Farm">
          </div>
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="form-control" placeholder="Min. 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label for="signupConfirm">Confirm Password</label>
            <input type="password" id="signupConfirm" class="form-control" placeholder="Re-enter password" required>
          </div>
          <div id="signupError" style="display:none;color:var(--red);font-size:12px;margin-bottom:12px;"></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;" id="signupSubmitBtn">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>

      </div>
    </div>

  </div>

  <script>
    /* ---------- Show inline error ---------- */
    function showInlineError(elementId, message) {
      var el = document.getElementById(elementId);
      if (el) {
        el.textContent = message;
        el.style.display = 'block';
      }
    }
    function hideInlineError(elementId) {
      var el = document.getElementById(elementId);
      if (el) el.style.display = 'none';
    }

    /* ---------- Show connection status ---------- */
    function showConnectionStatus() {
      var statusEl = document.getElementById('connectionStatus');
      if (!statusEl) return;

      if (typeof supabase === 'undefined' || !supabase || !supabase.auth) {
        statusEl.style.display = 'block';
        statusEl.style.background = '#FFEBEE';
        statusEl.style.color = 'var(--red)';
        statusEl.innerHTML = '<i class="fas fa-xmark-circle"></i> Supabase not loaded. You must use a local server (not file://). Run: npx serve .';
        return;
      }

      if (SUPABASE_URL === 'https://YOUR_PROJECT_ID.supabase.co' || SUPABASE_ANON_KEY === 'YOUR_SUPABASE_ANON_KEY') {
        statusEl.style.display = 'block';
        statusEl.style.background = '#FFF8E1';
        statusEl.style.color = '#E65100';
        statusEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Placeholder keys detected. Open js/supabase.js and add your real Supabase URL and anon key.';
        return;
      }

      /* Keys look set — try a quick test */
      statusEl.style.display = 'block';
      statusEl.style.background = '#E8F5E9';
      statusEl.style.color = 'var(--primary)';
      statusEl.innerHTML = '<i class="fas fa-check-circle"></i> Connected to Supabase';

      /* Fade out after 3 seconds */
      setTimeout(function() {
        statusEl.style.transition = 'opacity 0.5s';
        statusEl.style.opacity = '0';
        setTimeout(function() { statusEl.style.display = 'none'; }, 500);
      }, 3000);
    }

    /* ---------- Auth Tab Switching ---------- */
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(function(t) {
        t.classList.remove('active');
      });
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
      } else {
        document.getElementById('tabSignup').classList.add('active');
      }

      document.querySelectorAll('.auth-form').forEach(function(f) {
        f.classList.remove('active');
      });
      if (tab === 'login') {
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.getElementById('signupForm').classList.add('active');
      }

      hideInlineError('loginError');
      hideInlineError('signupError');
    }

    /* ---------- Handle Login ---------- */
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      hideInlineError('loginError');

      var email = document.getElementById('loginEmail').value.trim();
      var password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showInlineError('loginError', 'Please fill in all fields.');
        return;
      }

      /* Disable button to prevent double-click */
      var btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      login(email, password).then(function(success) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In';
        if (!success) {
          showInlineError('loginError', 'Login failed. Check your email and password.');
        }
      }).catch(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In';
        showInlineError('loginError', 'Unexpected error: ' + err.message);
      });
    });

    /* ---------- Handle Signup ---------- */
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();
      hideInlineError('signupError');

      var farmName = document.getElementById('signupFarmName').value.trim();
      var email = document.getElementById('signupEmail').value.trim();
      var password = document.getElementById('signupPassword').value;
      var confirm = document.getElementById('signupConfirm').value;

      if (!email || !password) {
        showInlineError('signupError', 'Email and password are required.');
        return;
      }
      if (password !== confirm) {
        showInlineError('signupError', 'Passwords do not match.');
        return;
      }
      if (password.length < 6) {
        showInlineError('signupError', 'Password must be at least 6 characters.');
        return;
      }

      var btn = document.getElementById('signupSubmitBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      signup(email, password, farmName).then(function(success) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        if (!success) {
          showInlineError('signupError', 'Signup failed. Check the details and try again.');
        }
      }).catch(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        showInlineError('signupError', 'Unexpected error: ' + err.message);
      });
    });

    /* ---------- On page load ---------- */
    (async function() {
      /* Show connection status banner */
      showConnectionStatus();

      /* If already logged in, redirect to dashboard */
      try {
        if (typeof supabase !== 'undefined' && supabase && supabase.auth) {
          var result = await supabase.auth.getSession();
          var session = result.data.session;
          if (session) {
            console.log('Already logged in as:', session.user.email);
            window.location.href = 'dashboard.html';
          }
        }
      } catch (err) {
        console.error('Session check error:', err);
      }
    })();
  </script>

</body>
</html>
