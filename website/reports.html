<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — LivestockPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><i class="fas fa-leaf"></i><span>LivestockPro</span></div>
      <button class="sidebar-close" id="sidebarClose"><i class="fas fa-xmark"></i></button>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="fas fa-gauge-high"></i> Dashboard</a>
      <a href="animals.html" class="nav-item"><i class="fas fa-cow"></i> Animals</a>
      <a href="health.html" class="nav-item"><i class="fas fa-stethoscope"></i> Health Records</a>
      <a href="feeding.html" class="nav-item"><i class="fas fa-wheat-awn"></i> Feeding</a>
      <a href="breeding.html" class="nav-item"><i class="fas fa-venus-mars"></i> Breeding</a>
      <a href="production.html" class="nav-item"><i class="fas fa-gauge"></i> Production</a>
      <a href="finance.html" class="nav-item"><i class="fas fa-coins"></i> Finance</a>
      <a href="tasks.html" class="nav-item"><i class="fas fa-list-check"></i> Tasks</a>
      <a href="reports.html" class="nav-item active"><i class="fas fa-chart-bar"></i> Reports</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-gear"></i> Settings</a>
      <a href="#" class="nav-item logout-item" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
    </nav>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
    </div>
    <div class="topbar-right">
    <button class="topbar-btn">
  <i class="fas fa-bell"></i>
  <span class="badge-dot"></span>
</button>
      <div class="user-menu"><div class="user-avatar" id="userAvatar">U</div><span class="user-name" id="userName">User</span></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <div id="pageStatus" style="display:none;padding:12px 16px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:20px;"></div>

    <div class="page-header">
      <div><h1>Full Farm Report</h1><p>Complete overview of all your farm data</p></div>
      <div class="d-flex gap-16 flex-wrap no-print">
        <button class="btn btn-secondary" id="refreshReportBtn"><i class="fas fa-rotate"></i> Refresh</button>
        <button class="btn btn-secondary" id="printReportBtn"><i class="fas fa-print"></i> Print</button>
        <button class="btn btn-primary" id="exportReportCsv"><i class="fas fa-file-export"></i> Export CSV</button>
      </div>
    </div>

    <!-- Date Filters -->
    <div class="card mb-24 no-print">
      <div class="card-body">
        <div class="filter-bar" style="margin-bottom:0;">
          <div class="form-group" style="margin-bottom:0;">
            <label style="margin-bottom:4px;">From Date</label>
            <input type="date" id="reportDateFrom" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label style="margin-bottom:4px;">To Date</label>
            <input type="date" id="reportDateTo" class="form-control">
          </div>
          <div class="form-group" style="margin-bottom:0;min-width:160px;">
            <label style="margin-bottom:4px;">Animal Tag</label>
            <input type="text" id="reportAnimal" class="form-control" placeholder="Filter by tag ID">
          </div>
          <button class="btn btn-primary" id="applyFilterBtn" style="align-self:flex-end;margin-top:auto;">
            <i class="fas fa-filter"></i> Apply Filter
          </button>
        </div>
      </div>
    </div>

    <!-- Report Container — populated entirely by JS -->
    <div id="reportOutput">
      <div class="empty-state" style="padding:60px 20px;">
        <i class="fas fa-spinner fa-spin" style="font-size:48px;display:block;margin-bottom:16px;opacity:0.4;"></i>
        <h3>Loading all farm data...</h3>
        <p>Please wait while the report is generated.</p>
      </div>
    </div>

  </main>

  <script src="js/reports.js"></script>
</body>
</html>
